# Spring Application Metadata
spring.application.name=citibike-analytics-api

# Default Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Embedded Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Spring Boot Actuator Endpoints (Required for ALB Health Check)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Custom Domain Properties
citibike.gbfs.language=en
citibike.pagination.default-page-size=50
citibike.pagination.max-page-size=200
citibike.stations.cache.name=station-status-cache
citibike.stations.dynamo.poll.rate-ms=${DYNAMO_TABLE_POLL_RATE:30000}

# Default local origins (Vite default on 5173, React default on 3000)
cors.allowed-origins=http://localhost:5173,http://localhost:3000